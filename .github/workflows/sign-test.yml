name: Sign Test Build

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  sign:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish
      run: dotnet publish app/GHelper.sln --configuration Release --runtime win-x64 -p:PublishSingleFile=true --no-self-contained -p:EnableUIAccess=true

    - name: Verify uiAccess in manifest
      shell: pwsh
      run: |
        $exe = 'app/bin/x64/Release/net8.0-windows/win-x64/publish/GHelper.exe'
        $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
        if ($text -notmatch 'uiAccess="true"') { Write-Error 'uiAccess="true" missing from embedded manifest'; exit 1 }

    - name: Upload unsigned
      id: upload-unsigned
      uses: actions/upload-artifact@v4
      with:
        name: GHelper-unsigned-${{ github.sha }}
        path: app/bin/x64/Release/net8.0-windows/win-x64/publish/GHelper.exe

    - uses: signpath/github-action-submit-signing-request@v1.1
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
        project-slug: ${{ secrets.SIGNPATH_PROJECT }}
        signing-policy-slug: ${{ secrets.SIGNPATH_POLICY }}
        github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
        wait-for-completion: true
        output-artifact-directory: './signed'

    - name: Upload signed
      uses: actions/upload-artifact@v4
      with:
        name: GHelper-signed-${{ github.sha }}
        path: ./signed/GHelper.exe
